plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    addModdingDependenciesTo sourceSets.test
}

['apiElements', 'runtimeElements', 'sourcesElements'/*, 'javadocElements'*/].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

configurations {
    commonJava { canBeResolved = false; canBeConsumed = true }
    commonResources { canBeResolved = false; canBeConsumed = true }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

dependencies {
    compileOnly "net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7"
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.3"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.3"
    implementation "org.apache.maven:maven-artifact:3.8.5"
    api "dev.ryanhcode.sable-companion:sable-companion-common-$minecraft_version:$sable_companion_version"
    implementation("foundry.veil:veil-common-${project.minecraft_version}:${project.veil_version}") { exclude group: "maven.modrinth" }
    compileOnly("foundry.imguimc:imguimc-common-${project.minecraft_version}:${project.imguimc_version}")
    compileOnly("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}") { transitive = false }
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${forgeconfigapiport_version}"
}

tasks.named('test', Test) { failOnNoDiscoveredTests = false }

def selfTests = [
        serverSubLevelLocationSnapshotSelfTest: 'dev.ryanhcode.sable.api.sublevel.ServerSubLevelLocationSnapshotSelfTest',
        subLevelReconstructionPreflightSelfTest: 'dev.ryanhcode.sable.sublevel.plot.SubLevelReconstructionPreflightSelfTest',
        subLevelReconstructionPlanSelfTest: 'dev.ryanhcode.sable.sublevel.plot.SubLevelReconstructionPlanSelfTest',
        subLevelReconstructionTransactionSelfTest: 'dev.ryanhcode.sable.sublevel.plot.SubLevelReconstructionTransactionSelfTest',
        subLevelReconstructionContainerBaselineSelfTest: 'dev.ryanhcode.sable.sublevel.plot.SubLevelReconstructionContainerBaselineSelfTest',
        subLevelReconstructionAttemptSelfTest: 'dev.ryanhcode.sable.sublevel.plot.SubLevelReconstructionAttemptSelfTest',
        subLevelReconstructionPayloadPreflightSelfTest: 'dev.ryanhcode.sable.sublevel.plot.SubLevelReconstructionPayloadPreflightSelfTest',
        subLevelReconstructionPublicationPreflightSelfTest: 'dev.ryanhcode.sable.sublevel.plot.SubLevelReconstructionPublicationPreflightSelfTest',
        subLevelReconstructionRegistryPreflightSelfTest: 'dev.ryanhcode.sable.sublevel.plot.SubLevelReconstructionRegistryPreflightSelfTest',
        physicsSectionTicketReservationSelfTest: 'dev.ryanhcode.sable.sublevel.system.ticket.PhysicsSectionTicketReservationSelfTest',
        physicsSectionMaterializationSelfTest: 'dev.ryanhcode.sable.sublevel.system.ticket.PhysicsSectionMaterializationSelfTest',
        subLevelSerializationChunkMetadataSelfTest: 'dev.ryanhcode.sable.sublevel.storage.serialization.SubLevelSerializationChunkMetadataSelfTest'
]

selfTests.each { taskName, mainClassName ->
    tasks.register(taskName, JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = mainClassName
        enableAssertions = true
    }
}

tasks.named('check') { dependsOn selfTests.keySet() }
