name: Cross-Dimension Transfer CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-dimension-transfer-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 21 Gradle Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon --console=plain 2>&1 | tee gradle-build.log

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-diagnostics
          path: |
            gradle-build.log
            **/build/test-results/test/**
            **/build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 7
