name: Cross-Dimension Transfer CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-dimension-transfer-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 21 Gradle Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Build and test
        run: ./gradlew build --stacktrace --no-daemon
